name = "metis-weather"
main = "worker/index.js"
compatibility_date = "2026-07-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[vars]
WEATHER_USER_AGENT = "MetisWeatherFeeds/3.4 (+https://metiscore.space)"
